version: 2

project_name: mailwizz-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: mailwizz-cli
    main: ./cmd/mailwizz-cli
    binary: mailwizz-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mailwizz-cli
    ids:
      - mailwizz-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^chore:"

homebrew_casks:
  - name: mailwizz-cli
    repository:
      owner: onetwist-software
      name: homebrew-mailwizz-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - mailwizz-cli
    homepage: "https://github.com/onetwist-software/mailwizz-cli"
    description: "CLI client for the MailWizz REST API"
    license: "MIT"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mailwizz-cli"]
          end

release:
  github:
    owner: onetwist-software
    name: mailwizz-cli
