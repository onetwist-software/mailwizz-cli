version: "3"

vars:
  BIN_DIR: bin
  CLI_BIN: "{{.BIN_DIR}}/mailwizz-cli"
  GEN_BIN: "{{.BIN_DIR}}/mailwizz-cli-gen"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the mailwizz-cli binary
    cmds:
      - go build -o {{.CLI_BIN}} ./cmd/mailwizz-cli

  install:
    desc: Install mailwizz-cli into GOBIN
    cmds:
      - go install ./cmd/mailwizz-cli

  generate:
    desc: Regenerate the API client and CLI commands from openapi/schema.json
    cmds:
      - go run ./cmd/mailwizz-cli-gen -schema openapi/schema.json -out internal/generated

  generate:check:
    desc: Fail if generated code is stale relative to openapi/schema.json
    cmds:
      - task: generate
      - |
        if ! git diff --quiet -- internal/generated; then
          echo "generated code is out of date, run 'task generate' and commit the result" >&2
          git --no-pager diff -- internal/generated
          exit 1
        fi

  fmt:
    desc: Format all Go source
    cmds:
      - gofmt -l -w .
      - go run golang.org/x/tools/cmd/goimports@latest -l -w .

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run all tests with race detection and coverage
    cmds:
      - go test -race -count=1 -coverprofile=coverage.txt ./...

  check:
    desc: Full verification used by CI - generate, lint, test, build
    cmds:
      - task: generate:check
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} dist coverage.txt coverage.html

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build release binaries for all platforms locally, without publishing
    cmds:
      - goreleaser release --snapshot --clean
